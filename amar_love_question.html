<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Love Amar?</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ff758c,#ff7eb3);font-family:Arial,sans-serif}
.card{background:white;padding:35px 25px;border-radius:25px;text-align:center;width:85%;max-width:420px;box-shadow:0 15px 40px #0003}
h1{color:#e91e63;font-size:28px}.buttons{display:flex;gap:15px;justify-content:center;margin-top:25px}
button{border:0;padding:13px 25px;border-radius:30px;font-size:18px;cursor:pointer}
.yes{background:#e91e63;color:white}.no{background:#eee;color:#333}
#message{display:none;color:#e91e63;font-size:20px;margin-top:20px}
</style>
</head>
<body>
<div class="card">
<h1>Do you love Amar? ❤️</h1>
<div class="buttons">
<button class="yes" onclick="yesClick()">Yes ❤️</button>
<button class="no" onclick="noClick()">No 😢</button>
</div>
<div id="message"></div>
</div>
<script>
function yesClick(){
 document.getElementById("message").style.display="block";
 document.getElementById("message").textContent="Okay, I will let you know ❤️";
}
function noClick(){
 alert("Please click. I request you, please click on Yes ❤️");
}
</script>
</body>
</html>
